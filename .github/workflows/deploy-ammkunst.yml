name: Deploy AMM Gallery to Cloudflare Pages
on:
  push:
    branches: [main]
    paths: ['ammkunst/**', '.github/workflows/deploy-ammkunst.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ammkunst-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check existing Cloudflare access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Cloudflare access secrets are not available in this GitHub repository.'
            exit 1
          fi
      - name: Optimise AMM artwork for web
        run: |
          python3 -m pip install --quiet --user Pillow==12.0.0
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          source=Path("ammkunst/source-images")
          destination=Path("ammkunst/site/art")
          destination.mkdir(parents=True,exist_ok=True)
          for src in sorted(source.glob("n*.jpeg")):
              with Image.open(src) as raw:
                  im=ImageOps.exif_transpose(raw).convert("RGB")
                  im.thumbnail((1550,1550),Image.Resampling.LANCZOS)
                  out=destination/(src.stem+".webp")
                  im.save(out,"WEBP",quality=85,method=6)
                  print(src.name,raw.size,"→",out.name,im.size,round(out.stat().st_size/1024),"KB")
          assert len(list(destination.glob("n*.webp")))==7, "Seven real artworks must be optimised"
          PY
      - name: Create and deploy Pages project
        working-directory: ammkunst
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.48.0 pages project create ammkunst --production-branch main || true
          npx --yes wrangler@4.48.0 pages deploy site --project-name ammkunst --branch main --commit-hash "$GITHUB_SHA"
      - name: Attach ammkunst.no
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/ammkunst/domains" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"name":"ammkunst.no"}' > /tmp/amm-domain-response.json || true
          python3 - <<'PY'
          import json
          try:
            j=json.load(open('/tmp/amm-domain-response.json'))
            print('Domain activation accepted:',j.get('success'))
            print('Cloudflare API feedback:',[e.get('message') for e in j.get('errors',[])])
          except Exception as e:
            print('Domain registration response unavailable',e)
          PY
      - name: Verify gallery
        run: |
          curl -fsSL --retry 6 --retry-delay 6 https://ammkunst.pages.dev/ -o /tmp/amm.html
          grep -q 'AMM' /tmp/amm.html
          curl -fsSL --retry 6 --retry-delay 6 https://ammkunst.pages.dev/art/a21.jpg -o /tmp/art.jpg
          test "$(wc -c < /tmp/art.jpg)" -gt 100000
      - name: Verify live custom domain
        run: |
          curl --fail --location --silent --show-error --retry 5 --retry-delay 5 --max-time 20 https://ammkunst.no/ -o /tmp/amm-custom.html
          grep -q 'AMM' /tmp/amm-custom.html
          curl --fail --location --silent --show-error --retry 5 --retry-delay 5 --max-time 20 https://ammkunst.no/art/n0388.webp -o /tmp/amm-custom-art.webp
          test "$(wc -c < /tmp/amm-custom-art.webp)" -gt 20000
          file /tmp/amm-custom-art.webp | grep -qi webp
          echo 'AMM deployed and verified on ammkunst.no'
