name: Odin Real Assets Import

on:
  push:
    branches:
      - build/odin-visual-truth-02
    paths:
      - .github/workflows/odin-real-assets-import.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/odin-visual-truth-02
      - name: Download verified ODIN assets from founder photo bank
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p odin-oddekalv/public/images/odin
          fetch_drive() {
            local id="$1" out="$2"
            curl -fLsS --retry 3 --retry-delay 2 \
              "https://drive.usercontent.google.com/download?id=${id}&export=download&confirm=t" \
              -o "$out"
            file "$out"
            test -s "$out"
          }
          fetch_drive "14yYzlEyhtcfEmrIOuBohEW6oZqS1cDEQ" "odin-oddekalv/public/images/odin/faroe-portrait-02.jpg"
          fetch_drive "1KvhKG-YVKc445V6lxAsd_vGRa871SSy-" "odin-oddekalv/public/images/odin/faroe-field-walk.jpg"
          fetch_drive "1vyDceXKnahnXKL2RhDOqMai-yVUMU0Vd" "odin-oddekalv/public/images/odin/long-way-home.jpg"
          fetch_drive "1G3H8_isp5mq-HE61vICNQ4r5LEIBiLJz" "odin-oddekalv/public/images/odin/mulafossur.jpg"
          fetch_drive "18DxTXvytbR73SqlQtrYYVEf-Ht8kjbrV" "odin-oddekalv/public/images/odin/arctic-white-angel.jpg"
          fetch_drive "16v12thttWgxmCeDfJBB-1eKY6QLQO1d0" "odin-oddekalv/public/images/odin/the-future.jpg"
          fetch_drive "1FoGcMY6jOsRJcaU4fiFMxQH7YuBBSVqc" "odin-oddekalv/public/images/odin/hope-4planet.jpg"
          fetch_drive "15K-riJxVx_tcw_YDEZcC1y6OLAIteycx" "odin-oddekalv/public/images/odin/odin-field.jpg"
      - name: Verify JPEG payloads
        shell: bash
        run: |
          set -euo pipefail
          for f in odin-oddekalv/public/images/odin/*.jpg; do
            python3 - "$f" <<'PY'
          import sys
          p=sys.argv[1]
          b=open(p,'rb').read(2)
          assert b == b'\xff\xd8', f'Not a JPEG: {p} {b!r}'
          PY
          done
      - name: Commit verified real assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add odin-oddekalv/public/images/odin
          if git diff --cached --quiet; then
            echo "No asset changes"
          else
            git commit -m "Assets: install verified Odin photo masters"
            git push origin HEAD:build/odin-visual-truth-02
          fi
