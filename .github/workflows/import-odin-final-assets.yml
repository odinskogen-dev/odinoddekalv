name: Probe ODIN asset import

on:
  push:
    branches:
      - build/odin-universe-04-gold

permissions:
  contents: write

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: build/odin-universe-04-gold
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Drive access
        shell: bash
        run: |
          set +e
          pip install --disable-pip-version-check gdown >/tmp/pip.log 2>&1
          python - <<'PY' >/tmp/gdown.log 2>&1
          import gdown, os
          fid='1PcVj2HXAuuswXsJGjAU1sp4FF7rT5MWt'
          out='/tmp/village-life.jpg'
          print('result=', gdown.download(id=fid, output=out, quiet=False, fuzzy=True))
          print('exists=', os.path.exists(out))
          print('size=', os.path.getsize(out) if os.path.exists(out) else 0)
          PY
          curl -L -sS -D /tmp/curl.headers -o /tmp/curl.bin "https://drive.usercontent.google.com/download?id=1PcVj2HXAuuswXsJGjAU1sp4FF7rT5MWt&export=download&confirm=t"
          {
            echo "GDOWN"
            cat /tmp/gdown.log
            echo
            echo "CURL_HEADERS"
            cat /tmp/curl.headers
            echo
            echo "CURL_SIZE=$(wc -c </tmp/curl.bin 2>/dev/null || echo 0)"
            file /tmp/curl.bin 2>/dev/null || true
          } > asset-probe.txt
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add asset-probe.txt
          git commit -m "Ops: record Drive asset probe" || exit 0
          git push origin HEAD:build/odin-universe-04-gold
