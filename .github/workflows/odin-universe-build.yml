name: Odin Universe Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odin-oddekalv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: odin-oddekalv/package-lock.json
      - run: npm ci
      - run: npm run build

  verify-live:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify oddekalv.org after Cloudflare Pages deploy
        shell: bash
        run: |
          set -euo pipefail
          base="https://oddekalv.org"
          ok=0
          for attempt in $(seq 1 20); do
            echo "Live check attempt $attempt/20"
            code=$(curl -L -sS -o /tmp/home.html --max-time 20 -w '%{http_code}' "$base/" || true)
            if [ "$code" = "200" ] && grep -q "The living world came first" /tmp/home.html; then
              notes=$(curl -L -sS --max-time 20 "$base/journal/" || true)
              photography=$(curl -L -sS --max-time 20 "$base/photography/" || true)
              prints=$(curl -L -sS --max-time 20 "$base/prints/" || true)
              work=$(curl -L -sS --max-time 20 "$base/work/" || true)
              if grep -q "Before the Decision Is Made" <<<"$notes" && grep -q "PHOTOGRAPHY · SELECTED ARCHIVE" <<<"$photography" && grep -q "OPEN EDITION PRINTS" <<<"$prints" && grep -q "4PLANET · WHY" <<<"$work"; then
                ok=1
                break
              fi
            fi
            sleep 15
          done

          test "$ok" = "1"

          routes=("/story/" "/field/" "/field/faroe-islands/" "/photography/" "/prints/" "/journal/" "/journal/before-the-decision-is-made/" "/journal/truth-by-design/" "/journal/future-worth-choosing/" "/work/" "/archive/" "/press/" "/manifest/" "/now/")
          for route in "${routes[@]}"; do
            code=$(curl -L -sS -o /tmp/route.html --max-time 20 -w '%{http_code}' "$base$route" || true)
            echo "$route -> $code"
            test "$code" = "200"
          done

          grep -q "BLOODY FJORDS" <(curl -L -sS --max-time 20 "$base/field/faroe-islands/")
          grep -q "Before the Decision Is Made" <(curl -L -sS --max-time 20 "$base/journal/before-the-decision-is-made/")
          grep -q "Truth by Design" <(curl -L -sS --max-time 20 "$base/journal/truth-by-design/")
          grep -q "4PLANET · WHY" <(curl -L -sS --max-time 20 "$base/work/")
          grep -q "SHORT BIO" <(curl -L -sS --max-time 20 "$base/press/")
          grep -q "ALT JEG ELSKER LEVER" <(curl -L -sS --max-time 20 "$base/manifest/")

          echo "ODIN Universe live health gate passed."
