name: Odin Universe Build

on:
  push:
    branches:
      - build/odin-universe-03
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: odin-oddekalv
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: odin-oddekalv/package-lock.json
      - run: npm ci
      - run: npm run build
