name: Prepare AMM Web Art
on:
  push:
    branches: [main]
    paths:
      - 'ammkunst/source-images/**'
      - '.github/workflows/prepare-amm-web-art.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: amm-prepare-web-art
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Convert real AMM source photographs to lightweight web images
        run: |
          python -m pip install --quiet Pillow==12.0.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          src = Path("ammkunst/source-images")
          dest = Path("ammkunst/site/art")
          dest.mkdir(parents=True,exist_ok=True)
          files = sorted(src.glob("n*.jpeg"))
          assert len(files) == 7, "Expected exactly seven new AMM images"
          for file in files:
              with Image.open(file) as master:
                  img = ImageOps.exif_transpose(master).convert("RGB")
                  img.thumbnail((1550,1550),Image.Resampling.LANCZOS)
                  out = dest/(file.stem+".webp")
                  img.save(out, "WEBP", quality=85, method=6)
                  assert out.stat().st_size > 15000
                  print(file.name,"->",out.name,round(out.stat().st_size/1024),"KB")
          PY
      - name: Commit web images to canonical AMM codebase
        run: |
          set -euo pipefail
          git config user.name "AMM Gallery Automation"
          git config user.email "actions@users.noreply.github.com"
          git add ammkunst/site/art/n*.webp
          if git diff --cached --quiet; then
            echo "Web images already up to date."
          else
            git commit -m "assets(amm): optimise seven confirmed artwork photos for web"
            git push origin HEAD:main
          fi
